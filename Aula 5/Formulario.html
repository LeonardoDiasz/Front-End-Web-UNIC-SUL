<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title> Formulario </title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
        <label>Digite seu Nome: </label> <br>
        <input type="text">
        <br>
        <label>Digite seu E-mail: </label> <br>
        <input type="text">
        <br>
        <label> Selecione seu sexo: </label> <br>
        <input type = "radio" value="Masculino" name="sexo"> Masculino <br>
        <input type = "radio" value="Feminino" name="sexo"> Feminino <br>
        <input type = "radio" value="Outro" name="sexo"> Outro <br>
        <label> Login: </label> <br>
        <input type="text" name="login"><br>
        <label> Senha: </label> <br>
        <input type="password" name="senha"><br>
        <label> Onde Estuda? </label> <br>
        <input type="checkbox" name="onde_estuda" value="Cruzeiro do Sul"> SP - São Miguel <br>
        <input type="checkbox" name="onde_estuda" value="Liberdade"> SP - Liberdade <br>
        <input type="checkbox" name="onde_estuda" value="Paulista"> SP - Paulista <br>
        <input type="checkbox" name="onde_estuda" value="Guarulhos"> GRU <br>
        <label> Cidade: </label>
        <select>
            <option> Nova Cruz </option>
            <option> Serrinha </option>
            <option> Montanhas </option>
            <option> Brejinho </option>
            <option> Monte Alegre </option>
            <option> Natal </option>
        </select>
        <br>
        <label> Observações </label> <br>
        <textarea name="observacoes" rows="4" cols="20">Digite aqui...</textarea>
        <br>
        <button type = "submit"> Enviar </button>
        <button type="reset"> Limpar </button>
        
        </fieldset>
    </form>
    
</body>
</html>
